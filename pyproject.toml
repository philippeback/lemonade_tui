[project]
name = "lemonade-tui"
version = "1.0.0"
description = "Real-time inference telemetry and systems analytics TUI for Lemonade Server LLM workloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Philippe Back" }
]
dependencies = [
    "rich>=13.0.0",
    "textual>=0.80.0"
]

[project.scripts]
lemonade-tui = "lemonade_tui:main"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"
