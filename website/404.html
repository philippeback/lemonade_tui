<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found | Lemonade TUI</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/logo-icon.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .code-404 {
      font-family: var(--font-mono);
      font-size: 72px;
      font-weight: 800;
      color: var(--color-accent-citrus);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container not-found-wrap">
    <img src="assets/brand/logo-lemonade-tui.svg" alt="Lemonade TUI Logo" style="height: 48px; margin-bottom: 24px;">
    <div class="code-404">404: SLOT NOT FOUND</div>
    <p style="color: var(--color-text-muted); font-size: 16px; max-width: 480px; margin-bottom: 24px;">
      The requested telemetry endpoint or document could not be resolved by the slot scheduler.
    </p>
    <a href="index.html" class="btn btn-primary">Return to Telemetry Dashboard</a>
  </div>
</body>
</html>
