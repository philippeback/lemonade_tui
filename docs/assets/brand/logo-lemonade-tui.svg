<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="citrusGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="60%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="pulpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Citrus Emblem (Left) -->
  <g transform="translate(10, 10)">
    <!-- Outer Rind / Circle -->
    <circle cx="40" cy="40" r="36" stroke="#30363d" stroke-width="2" fill="#161b22"/>
    <circle cx="40" cy="40" r="34" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="14 4" fill="#0d1117"/>
    <circle cx="40" cy="40" r="28" stroke="#d29922" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

    <!-- Citrus Wedges styled as terminal diagnostic telemetry matrix -->
    <!-- Wedge 1 (Top) -->
    <path d="M 38 18 L 38 34 L 28 24 Z" fill="url(#citrusGlow)" opacity="0.85"/>
    <path d="M 42 18 L 52 24 L 42 34 Z" fill="url(#citrusGlow)" opacity="0.95"/>
    <!-- Wedge 2 (Right) -->
    <path d="M 62 38 L 46 38 L 56 28 Z" fill="url(#citrusGlow)" opacity="0.85"/>
    <path d="M 62 42 L 56 52 L 46 42 Z" fill="#3fb950" opacity="0.9"/>
    <!-- Wedge 3 (Bottom) -->
    <path d="M 42 62 L 42 46 L 52 56 Z" fill="url(#citrusGlow)" opacity="0.85"/>
    <path d="M 38 62 L 28 56 L 38 46 Z" fill="url(#citrusGlow)" opacity="0.8"/>
    <!-- Wedge 4 (Left) -->
    <path d="M 18 42 L 34 42 L 24 52 Z" fill="url(#citrusGlow)" opacity="0.75"/>
    <path d="M 18 38 L 24 28 L 34 38 Z" fill="#58a6ff" opacity="0.85"/>

    <!-- Central Terminal Pulse -->
    <circle cx="40" cy="40" r="5" fill="#f0883e" filter="url(#neonGlow)"/>
    <circle cx="40" cy="40" r="2.5" fill="#ffffff"/>

    <!-- Monospace Terminal Bracket Accent [ ] around citrus -->
    <path d="M 8 28 L 3 28 L 3 52 L 8 52" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 72 28 L 77 28 L 77 52 L 72 52" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: Wordmark & Badges -->
  <g transform="translate(105, 0)">
    <!-- Main Text "Lemonade" -->
    <text x="0" y="52" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#c9d1d9" letter-spacing="-0.5">
      Lemonade
    </text>
    <!-- Highlight Monospace "TUI" -->
    <text x="172" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="34" font-weight="800" fill="#f0883e" filter="url(#neonGlow)">
      TUI
    </text>
    
    <!-- Subtitle Pill Badge -->
    <rect x="250" y="27" width="155" height="26" rx="4" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <circle cx="262" cy="40" r="3.5" fill="#3fb950"/>
    <text x="272" y="44" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1.2">
      TELEMETRY HUD
    </text>

    <!-- Descriptor line below wordmark -->
    <text x="2" y="76" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="500" fill="#8b949e">
      LLM Inference Telemetry &amp; Systems Analytics
    </text>
  </g>
</svg>
